---
# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: production
  labels:
    name: production

---
# Service Account
apiVersion: v1
kind: ServiceAccount
metadata:
  name: core-banking-service
  namespace: production
  labels:
    app: core-banking-service

---
# ConfigMap for application properties
apiVersion: v1
kind: ConfigMap
metadata:
  name: core-banking-config
  namespace: production
  labels:
    app: core-banking-service
data:
  SPRING_PROFILES_ACTIVE: "kubernetes,production"
  SPRING_APPLICATION_NAME: "core-banking-service"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "validate"
  SPRING_JPA_SHOW_SQL: "false"
  SPRING_DATASOURCE_URL: "jdbc:mysql://mysql-service.production.svc.cluster.local:3306/core_banking?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
  SERVER_PORT: "8092"
  SERVER_SERVLET_CONTEXT_PATH: "/"
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,metrics,info,prometheus"
  MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: "when-authorized"
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://service-registry.production.svc.cluster.local:8761/eureka/"
  EUREKA_CLIENT_REGISTER_WITH_EUREKA: "true"
  EUREKA_CLIENT_FETCH_REGISTRY: "true"
  EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"
  EUREKA_INSTANCE_HOSTNAME: "core-banking-service.production.svc.cluster.local"

---
# Secret for sensitive data
apiVersion: v1
kind: Secret
metadata:
  name: core-banking-secrets
  namespace: production
  labels:
    app: core-banking-service
type: Opaque
stringData:
  SPRING_DATASOURCE_USERNAME: "core_banking_user"
  SPRING_DATASOURCE_PASSWORD: "SecurePassword123!@#"
  SPRING_CLOUD_CONFIG_USERNAME: "config_user"
  SPRING_CLOUD_CONFIG_PASSWORD: "ConfigPassword123!@#"

---
# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-banking-service
  namespace: production
  labels:
    app: core-banking-service
    version: v1
  annotations:
    description: "Core Banking Service - Account Management"
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: core-banking-service
  template:
    metadata:
      labels:
        app: core-banking-service
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8092"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      serviceAccountName: core-banking-service
      
      # Pod affinity for better distribution
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - core-banking-service
              topologyKey: kubernetes.io/hostname
      
      # Tolerations for node taints (if any)
      tolerations: []
      
      # Init containers for dependencies
      initContainers:
      - name: wait-for-mysql
        image: busybox:1.28
        command: ['sh', '-c', "until nc -z mysql-service.production.svc.cluster.local 3306; do echo waiting for mysql; sleep 2; done"]
      - name: wait-for-registry
        image: busybox:1.28
        command: ['sh', '-c', "until nc -z service-registry.production.svc.cluster.local 8761; do echo waiting for service registry; sleep 2; done"]
      
      containers:
      - name: core-banking-service
        image: registry.gitlab.com/group/project/core-banking-service:latest
        imagePullPolicy: IfNotPresent
        
        # Container ports
        ports:
        - name: http
          containerPort: 8092
          protocol: TCP
        - name: jmx
          containerPort: 9090
          protocol: TCP
        
        # Environment variables from ConfigMap and Secret
        envFrom:
        - configMapRef:
            name: core-banking-config
        - secretRef:
            name: core-banking-secrets
        
        # Additional environment variables
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: LOG_LEVEL
          value: "INFO"
        
        # Startup probe (gives time to start)
        startupProbe:
          httpGet:
            path: /actuator/health/startup
            port: http
          failureThreshold: 30
          periodSeconds: 10
          initialDelaySeconds: 0
          timeoutSeconds: 3
        
        # Readiness probe (checks if ready to receive traffic)
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 2
          successThreshold: 1
        
        # Liveness probe (checks if process is alive)
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: http
          initialDelaySeconds: 60
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
          successThreshold: 1
        
        # Resource management
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
            ephemeral-storage: "1Gi"
          limits:
            memory: "1Gi"
            cpu: "500m"
            ephemeral-storage: "2Gi"
        
        # Volume mounts
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: logs
          mountPath: /var/log/app
        
        # Security context for container
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      
      # Volumes
      volumes:
      - name: tmp
        emptyDir: {}
      - name: logs
        emptyDir: {}
      
      # Pod security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      
      # Termination grace period
      terminationGracePeriodSeconds: 30
      
      # Image pull secrets for private registry
      imagePullSecrets:
      - name: gitlab-registry-secret

---
# Service
apiVersion: v1
kind: Service
metadata:
  name: core-banking-service
  namespace: production
  labels:
    app: core-banking-service
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8092"
spec:
  type: ClusterIP
  selector:
    app: core-banking-service
  ports:
  - name: http
    port: 8092
    targetPort: 8092
    protocol: TCP
  sessionAffinity: None

---
# Horizontal Pod Autoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: core-banking-service-hpa
  namespace: production
  labels:
    app: core-banking-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: core-banking-service
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
      - type: Pods
        value: 2
        periodSeconds: 15

---
# Pod Disruption Budget
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: core-banking-service-pdb
  namespace: production
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: core-banking-service

---
# Network Policy (restrict traffic)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: core-banking-service-network-policy
  namespace: production
spec:
  podSelector:
    matchLabels:
      app: core-banking-service
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: api-gateway
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8092
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: service-registry
    ports:
    - protocol: TCP
      port: 8761
  - to:
    - podSelector:
        matchLabels:
          app: mysql
    ports:
    - protocol: TCP
      port: 3306
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53

---
# Role for service account
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: core-banking-service-role
  namespace: production
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]

---
# RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: core-banking-service-rolebinding
  namespace: production
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: core-banking-service-role
subjects:
- kind: ServiceAccount
  name: core-banking-service
  namespace: production
